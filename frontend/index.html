<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes"><title>Lucy Ω</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#1e1e1e;--text:#ededed;--accent:#f97316;--gold:#d4af37;--border:#2a2a2a}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:16px}
nav{display:flex;justify-content:space-between;align-items:center;padding:0.75rem 1rem;border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap;gap:0.5rem}
.logo{font-size:1.3rem;font-weight:bold;color:var(--accent)}
.nav-links{display:flex;flex-wrap:wrap;gap:0.75rem}
.nav-links a{color:var(--text);text-decoration:none;font-size:0.9rem}
.container{max-width:1200px;margin:1rem auto;padding:1rem;background:var(--card);border-radius:1rem;border:1px solid var(--border);width:calc(100% - 2rem)}
.btn{background:var(--accent);color:white;border:none;padding:0.6rem 1.2rem;border-radius:2rem;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.lucy-logo{position:fixed;bottom:20px;right:20px;width:48px;height:48px;background:var(--gold);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000}
.lucy-logo svg{width:28px;height:28px}
.chat-window{position:fixed;bottom:75px;right:20px;width:calc(100vw - 40px);max-width:360px;background:var(--card);border-radius:16px;border:1px solid var(--border);display:none;flex-direction:column;z-index:1001;overflow:hidden}
.chat-header{background:var(--accent);padding:0.75rem;font-weight:bold;display:flex;justify-content:space-between}
.chat-messages{flex:1;padding:0.75rem;overflow-y:auto;max-height:40vh;background:var(--bg)}
.chat-input-area{display:flex;border-top:1px solid var(--border)}
.chat-input-area input{flex:1;padding:0.6rem;border:none;background:transparent;color:var(--text)}
.chat-input-area button{background:var(--accent);border:none;padding:0 1rem;cursor:pointer;color:white}
.message{margin-bottom:0.5rem;padding:0.4rem 0.7rem;border-radius:1rem;max-width:85%;word-wrap:break-word}
.user{background:var(--accent);color:white;margin-left:auto}
.assistant{background:var(--border);color:var(--text)}
@media (max-width: 600px){
  nav{flex-direction:column;align-items:flex-start}
  .nav-links{width:100%;justify-content:space-around}
  .btn{width:100%;margin-top:0.5rem}
}
</style></head>
<body>
<nav><span class="logo">⚡ Lucy Ω</span><div class="nav-links"><a href="/">Home</a><a href="/tools.html">Tools</a><a href="/signup.html">Partner</a><a href="/dashboard.html">Dashboard</a><a href="/upgrade.html">Upgrade</a><a href="/support.html">Support</a></div></nav>
<div class="container"><h1 style="font-size:1.8rem">AI Growth Platform</h1><p style="margin-bottom:1.5rem">Monetize your audience with AI tools & affiliate income.</p><a href="/signup.html" class="btn" style="margin-right:0.5rem">Become a Partner</a><a href="/tools.html" class="btn" style="background:#333">Try AI Tools →</a></div>
<footer style="text-align:center;margin-top:2rem;color:#666">© Lucy Ω — Creator Revenue Toolbox</footer>
<div id="lucyLogo" class="lucy-logo"><svg viewBox="0 0 200 200" width="28" height="28"><path d="M40 160 L60 40 L100 120 L140 40 L160 160" stroke="#d4af37" stroke-width="20"/></svg></div>
<div id="chatWindow" class="chat-window"><div class="chat-header">Lucy Assistant<span id="closeChat" style="cursor:pointer">✕</span></div><div id="chatMessages" class="chat-messages"><div class="message assistant">Ask me anything!</div></div><div class="chat-input-area"><input id="chatInput" placeholder="Type..."><button id="sendChat">Send</button></div></div>
<script>
const BACKEND = "https://lucy-omega-backend.onrender.com"; // replace after backend deploy
const logo=document.getElementById('lucyLogo'),win=document.getElementById('chatWindow'),close=document.getElementById('closeChat'),send=document.getElementById('sendChat'),inp=document.getElementById('chatInput'),msgs=document.getElementById('chatMessages');
logo.onclick=()=>win.style.display='flex'; close.onclick=()=>win.style.display='none';
function addMsg(t,r){let d=document.createElement('div');d.className='message '+r;d.innerText=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
send.onclick=async()=>{let m=inp.value.trim();if(!m)return;addMsg(m,'user');inp.value='';addMsg('Thinking...','assistant');
try{let r=await fetch(BACKEND+'/api/ai-tool',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:'chat',prompt:m})});let d=await r.json();msgs.lastChild.remove();addMsg(d.result||'Sorry','assistant');}catch(e){msgs.lastChild.remove();addMsg('Network error','assistant');}};
inp.addEventListener('keypress',e=>{if(e.key==='Enter')send.click();});
</script></body></html>
